name: agents-manager-studio

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: studio
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 5s
      timeout: 3s
      retries: 20

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.42.5
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: studio
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      N8N_HOST: n8n.localhost
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://n8n.localhost/
      WEBHOOK_URL: http://n8n.localhost/
      # Login cookie over plain HTTP (local only).
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      GENERIC_TIMEZONE: ${TZ:-America/Sao_Paulo}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

  # Throwaway Redis for the tests of agents (one database index per run, flushed when it ends); nothing persisted.
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  server:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgresql://studio:${POSTGRES_PASSWORD}@postgres:5432/studio
      PROJECTS_DIR: /data/Projetos
      PROJECTS_HOST_DIR: ${PROJECTS_HOST_DIR:?set PROJECTS_HOST_DIR in .env}
      SCAN_EXCLUDE: ${SCAN_EXCLUDE:-Pessoais}
      ENCRYPTION_KEY: ${STUDIO_ENCRYPTION_KEY:?set STUDIO_ENCRYPTION_KEY in .env}
      SKILLS_DIR: /data/claude-skills
      AGENT_RUNNER_IMAGE: agents-manager-studio-agent-runner:latest
      AGENTS_DIR: /data/agents
      AGENTS_HOST_DIR: ${AGENTS_HOST_DIR:?set AGENTS_HOST_DIR in .env}
      CLAUDE_SKILLS_HOST_DIR: ${CLAUDE_SKILLS_HOST_DIR}
      AGENT_NETWORK: agents-manager-studio_default
      SERVER_INTERNAL_URL: http://server:3000
      AGENT_LAUNCH_MEMORY_PERCENT: ${AGENT_LAUNCH_MEMORY_PERCENT:-80}
      AGENT_LAUNCH_CPU_PERCENT: ${AGENT_LAUNCH_CPU_PERCENT:-85}
      WORKFLOW_PLAN_LIMIT_PERCENT: ${WORKFLOW_PLAN_LIMIT_PERCENT:-80}
      RENDER_API_URL: ${RENDER_API_URL:-https://api.render.com/v1}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TZ: ${TZ:-America/Sao_Paulo}
    # The Docker socket is root-only; access to it is root-equivalent anyway.
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Writable so the Studio can create workspace folders here (only this folder, not the whole drive).
      - ${PROJECTS_HOST_DIR}:/data/Projetos
      # Older agent copies and the Windows mirror of the new ones (code only, written when the agents finish).
      - ${AGENTS_HOST_DIR}:/data/agents
      # One isolated clone per agent (new ones): a Docker volume, fast; each agent container mounts its own folder.
      - agent_copies:/data/agents-vol
      - ${CLAUDE_SKILLS_HOST_DIR:?set CLAUDE_SKILLS_HOST_DIR in .env}:/data/claude-skills:ro
      # Requests to the Windows helper (studio.ps1), which changes the central folder and recreates the server.
      - ./host-helper:/data/host-helper
    depends_on:
      postgres:
        condition: service_healthy

  # Image only: the server starts containers from it (agents and account checks).
  # Build with: docker compose --profile tools build agent-runner
  agent-runner:
    image: agents-manager-studio-agent-runner:latest
    build:
      context: ./agent-runner
    profiles: ["tools"]

  ui:
    build:
      context: ./ui
    restart: unless-stopped

  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      UI_UPSTREAM: ui:80
    volumes:
      - ./infra/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - server
      - ui
      - n8n

  # Cloudflare Tunnel: a public https address for the git webhooks, with no port opened on the router and no fixed IP.
  # Its public hostname (in Cloudflare) points to http://server:3000 with the path ^/api/webhooks/; the server also
  # refuses anything else that comes through it. Turned on with COMPOSE_PROFILES=tunnel and CLOUDFLARE_TUNNEL_TOKEN in .env.
  tunnel:
    image: cloudflare/cloudflared:2026.9.2
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    profiles: ["tunnel"]
    depends_on:
      - server

volumes:
  postgres_data:
  n8n_data:
  caddy_data:
  agent_copies:
    # Fixed name: the server mounts folders of it into agent containers by this name (AGENTS_VOLUME).
    name: ams-agents
