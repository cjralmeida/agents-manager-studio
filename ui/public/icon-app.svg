<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed cut for home-screen icons: iOS and Android apply their own corner mask, so the artwork stays inside the central safe zone. -->
  <defs>
    <linearGradient id="ams-app" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2130"/>
      <stop offset="1" stop-color="#0f1115"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" fill="url(#ams-app)"/>
  <g transform="translate(32 32) scale(0.72) translate(-32 -32)">
    <ellipse cx="32" cy="32" rx="22" ry="10" transform="rotate(-28 32 32)" fill="none" stroke="#7c9cff" stroke-width="3.2"/>
    <circle cx="32" cy="32" r="8" fill="#e6e9ef"/>
    <circle cx="51.4" cy="21.7" r="4.8" fill="#7c9cff"/>
    <circle cx="12.6" cy="42.3" r="4.8" fill="#fbbf24"/>
  </g>
</svg>
